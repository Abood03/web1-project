<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="cs.css">
    <script src="index.js"></script>
</head>
<body>
<div id="header">
    <div class="headerNew"><span><a class="headerNew" href="Home.html">Hotel</a></span></div>
    <a class="links" href="Home.html">Home</a>
    <a class="links" href="BookNow.html">Book Now</a>
    <a class="links" href="About.html">About</a>
</div>
<div id="main">
    <form id="bookForm">
        <p style="font-weight: bold">your info</p>
        <label for="name">Full Name:</label>
        <input type="text" id="name"><br>
        <label for="email">Email:</label>
        <input type="text" id="email"><br>
        <label for="mobile">Mobile:</label>
        <input type="tel" id="mobile"><br>
        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" value="date" onchange="contDay()"><br>
        <label for="endDate" >End Date:</label>
        <input type="date" id="endDate" onchange="contDay()"><br>
        <p></p>
        <hr>
        <label>roomtype</label><br>
        <input type="radio"id="Stander"name="roomType"value="800" onchange="totalPrice()" >
        <label for="Stander">stander</label><br>
        <input type="radio"id="delux"name="roomType" value="300" onchange="totalPrice()">
        <label for="delux">delux</label><br>
        <input type="radio"id="suite"name="roomType"value="1800" onchange="totalPrice()">
        <label for="suite">suite</label><br>
        <hr>
        <input type="checkbox"id="serves"value="50" onchange="totalPrice()" >gym +50<br>
        <input type="checkbox"id="serves2"value="70" onchange="totalPrice()" >spa +70<br>
        <input type="checkbox"id="serves3"value="20" onchange="totalPrice()">brackfast +20<br>
        <input type="submit" value="submit">
    </form>
</div>

</body>
</html>
